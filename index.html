<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Веломеста Самарской области</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="leaflet-fix.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="atlas">
      <aside class="guide-panel">
        <header class="brand">
          <p>Велогид</p>
          <h1>Самарская область</h1>
          <span>Трейлы, грунты, видовые горы и длинные петли вокруг Волги.</span>
        </header>

        <section class="search-box" aria-label="Поиск места">
          <input id="searchInput" type="search" placeholder="Найти место или район" />
        </section>

        <section class="filter-group" aria-label="Фильтр по формату">
          <div class="section-label">Формат</div>
          <div class="chips" id="styleFilters"></div>
        </section>

        <section class="filter-group" aria-label="Фильтр по району">
          <div class="section-label">Район</div>
          <div class="chips" id="regionFilters"></div>
        </section>

        <section class="quick-stats" aria-label="Статистика каталога">
          <div>
            <strong id="totalCount">0</strong>
            <span>мест</span>
          </div>
          <div>
            <strong id="longCount">0</strong>
            <span>длинных</span>
          </div>
          <div>
            <strong id="parkCount">0</strong>
            <span>ООПТ</span>
          </div>
        </section>

        <section class="collection">
          <div class="section-label">Подборки</div>
          <div id="collectionList" class="collection-list"></div>
        </section>
      </aside>

      <section class="map-stage" aria-label="Карта веломест">
        <div id="map"></div>
        <div class="map-head">
          <div>
            <p>Карта спотов</p>
            <h2 id="mapTitle">Все места</h2>
          </div>
          <button id="fitMap" type="button">Показать всё</button>
        </div>
        <div class="map-legend" aria-label="Легенда карты">
          <span><i class="legend-dot trail"></i>трейлы</span>
          <span><i class="legend-dot scenic"></i>видовые</span>
          <span><i class="legend-dot long"></i>длинные</span>
          <span><i class="legend-dot park"></i>ООПТ</span>
        </div>
      </section>

      <aside class="place-panel" aria-label="Выбранное место">
        <section class="place-detail" id="placeDetail"></section>
        <section class="place-list-shell">
          <div class="list-top">
            <div>
              <p class="section-label">Каталог</p>
              <h2 id="listTitle">Все веломеста</h2>
            </div>
            <span id="visibleCount">0</span>
          </div>
          <div class="place-list" id="placeList" aria-live="polite"></div>
        </section>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
    <script src="photos.js"></script>
    <script src="ui-fix.js"></script>
  </body>
</html>
